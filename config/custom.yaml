zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: null # Or set a list of glob patterns, e.g. ["2026/survey/**","2026/reading-group/**"]

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  api_mode: chat_completion
  generation_kwargs:
    model: gpt-4o-mini

source:
  arxiv:
    category: ["cs.AI","cs.CV","cs.LG","cs.CL"]

executor:
  debug: ${oc.env:DEBUG,null}
  source: ['arxiv']

reranker:
  prompt: |
    面向计算机系统研究，既寻找当前工作的直接进展，也提前发现 AI 发展中的系统研究机会，将两类价值同等重视：
    一类直接推进当前研究，例如 GPU 性能分析与可观测性、内核编译和执行机制、投机解码、LLM 推理与服务系统。
    另一类帮助发现未来系统研究机会：广泛关注 AI 新技术，尤其是模型架构、新增模块与计算范式的变化，例如 n-gram 查表、记忆模块、注意力与循环结构、稀疏化和专家路由、推理与 Agent 执行方式。
    判断这些变化会怎样改变计算图、访存与通信、状态复用、调度粒度或硬件需求，从中寻找值得研究的新瓶颈与系统机制。前排同时呈现这两类价值：新架构或新算法即使与现有收藏不相似、尚无成熟系统实现，也可排在当前方向的增量优化之前。对未来系统影响的推断作为待验证假设。
    综合问题的重要性、机制的新意、可迁移的实验方法与实际部署成本；部署便利不是前沿探索的入选门槛。深入修改模型参数的方法仍可保留方法速览价值，普通量化与侵入式有损剪枝分别判断。
    在直接相关工作与前沿探索之间保持覆盖，按论文内容安排优先级，不必强行为某一类凑数。
